<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="120" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48CAE4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0077B6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0096C7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#023E8A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03045E" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0D1B2A" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Onda de tras: lenta -->
  <g>
    <path fill="url(#g1)" d="M0,55 q150,-45 300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 L2400,120 L0,120 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Onda do meio: media, sentido oposto -->
  <g>
    <path fill="url(#g2)" d="M-600,70 q150,-40 300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 L1800,120 L-600,120 Z">
      <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Onda da frente: rapida -->
  <g>
    <path fill="url(#g3)" d="M0,88 q150,-30 300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 L2400,120 L0,120 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
